[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "brandframe"
version = "0.1.0"
description = "Configuration and safety tooling for brand repositories"
authors = [{name = "OuCodes"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["brand", "configuration", "operations", "yaml", "credentials", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.3",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/OuCodes/brandframe"
Repository = "https://github.com/OuCodes/brandframe"
Issues = "https://github.com/OuCodes/brandframe/issues"
Changelog = "https://github.com/OuCodes/brandframe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.4",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[project.scripts]
brandframe = "brandframe.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/brandframe"]
